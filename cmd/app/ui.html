<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay</title>
<style>
  :root { --bg: #EAF2FB; --card: #FFFFFF; --fg: #17263A; --muted: #4A5B70; --faint: #6B7A8C; --line: #D6E2F0; --track: #E3ECF6;
          --accent: #F59E0B; --face: #FFF4DD; --ink: #17263A; --blue: #2457C5; --green: #0E6B3A; --green-bg: #D7F3E3; --red: #B3261E; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101822; --card: #1A2533; --fg: #EEF3F8; --muted: #B4C0CE; --faint: #8795A6; --line: #0B1118; --track: #26344A; --face: #FFF4DD; --green-bg: #11402A; --ink: #5C6E86; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 "Nunito", system-ui, sans-serif; }
  .app { max-width: 440px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 20px; }
  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: baseline; gap: 10px; } .brand b { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
  .brand span { font-size: 13px; font-weight: 700; color: var(--muted); }
  .pill { font-size: 14px; font-weight: 800; color: var(--green); background: var(--green-bg); padding: 4px 12px; border-radius: 999px; }
  .card { background: var(--card); border-radius: 20px; padding: 24px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; box-shadow: 0 2px 0 var(--line); }
  .card svg { overflow: visible; margin-top: 24px; }
  .title { font-size: 18px; font-weight: 800; } .note { font-size: 14px; color: var(--muted); text-align: center; min-height: 42px; }
  .bar { width: 100%; height: 6px; background: var(--track); border-radius: 999px; overflow: hidden; } .bar div { height: 100%; width: 0; background: var(--blue); border-radius: 999px; transition: width 1s linear; }
  h2 { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin: 0; }
  .list { display: flex; flex-direction: column; gap: 8px; } .row { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border-radius: 12px; padding: 10px 12px; }
  .dot { width: 10px; height: 10px; border-radius: 999px; margin-top: 6px; flex-shrink: 0; background: var(--faint); }
  .row .t { font-size: 14px; font-weight: 700; } .row .d { font-size: 12px; color: var(--faint); } .row time { font-size: 12px; color: var(--faint); white-space: nowrap; }
  footer { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); } footer b { font-weight: 700; color: var(--muted); }
  .empty { color: var(--faint); font-size: 14px; }
  .settings { background: var(--card); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; font-weight: 700; }
  .seg { display: flex; background: var(--track); border-radius: 999px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; cursor: pointer; min-height: 32px; }
  .seg button[aria-pressed=true] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,0.15); }
  select { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); min-height: 32px; }
  button.link { border: 0; background: none; color: var(--blue); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 6px 4px; min-height: 32px; }
  .hint { font-size: 12px; color: var(--faint); font-weight: 500; overflow-wrap: anywhere; }

  /* Character states. The body sets data-state; each state turns on its own animations and parts. */
  .only-checking, .only-updating, .only-rejected { display: none; }
  [data-state=checking] .only-checking, [data-state=updating] .only-updating, [data-state=rejected] .only-rejected { display: initial; }
  [data-state=checking] .title { color: var(--blue); } [data-state=updating] .title { color: var(--blue); } [data-state=rejected] .title { color: var(--red); }
  [data-state=checking] .bar div { background: var(--blue); } [data-state=updating] .bar div { background: var(--green); } [data-state=rejected] .bar div { background: var(--red); }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 96% { transform: scaleY(0.1) } }
  @keyframes ping { 0% { transform: scale(0.4); opacity: 0.9 } 100% { transform: scale(2.4); opacity: 0 } }
  @keyframes tilt { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) } }
  @keyframes spin { to { transform: rotate(360deg) } }
  @keyframes hop { 0%,100% { transform: translateY(0) } 30% { transform: translateY(-16px) } 50% { transform: translateY(0) } }
  @keyframes shake { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-6px) } 40% { transform: translateX(6px) } 60% { transform: translateX(-4px) } 80% { transform: translateX(4px) } }
  @keyframes sparkle { 0%,100% { opacity: 0; transform: scale(0.5) } 50% { opacity: 1; transform: scale(1) } }
  .body { transform-origin: 100px 150px; } .eye { transform-origin: center; transform-box: fill-box; }
  [data-state=idle] .body { animation: bob 2.6s ease-in-out infinite; } [data-state=idle] .eye { animation: blink 5s infinite; }
  [data-state=checking] .body { animation: tilt 1.2s ease-in-out infinite; }
  .ring { transform-origin: 100px 14px; transform-box: fill-box; animation: ping 1.2s ease-out infinite; } .ring.b { animation-delay: 0.4s; }
  [data-state=updating] .body { animation: hop 1.4s ease-in-out infinite; } .orbit { transform-origin: 100px 100px; animation: spin 1.6s linear infinite; }
  .spark { transform-origin: center; transform-box: fill-box; animation: sparkle 1.4s ease-in-out infinite; } .spark.b { animation-delay: 0.5s; }
  [data-state=rejected] .body { animation: shake 2.2s ease-in-out infinite; }
  .mouth-idle, .mouth-happy, .mouth-sad, .brows { display: none; }
  [data-state=idle] .mouth-idle, [data-state=checking] .mouth-idle, [data-state=updating] .mouth-happy, [data-state=rejected] .mouth-sad, [data-state=rejected] .brows { display: initial; }
  @media (prefers-reduced-motion: reduce) { .body, .eye, .ring, .orbit, .spark { animation: none !important; } }
</style>
</head>
<body data-state="idle">
<div class="app">
  <header>
    <div class="brand"><b>Relay</b><span id="channel">stable channel</span></div>
    <div class="pill" id="version">v0.0.0</div>
  </header>

  <div class="card">
    <svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Bolt, the Relay mascot">
      <g class="only-checking"><circle class="ring" cx="100" cy="14" r="12" fill="none" stroke="var(--blue)" stroke-width="3"/><circle class="ring b" cx="100" cy="14" r="12" fill="none" stroke="var(--blue)" stroke-width="3"/></g>
      <g class="only-updating">
        <circle class="orbit" cx="100" cy="100" r="88" fill="none" stroke="var(--blue)" stroke-width="5" stroke-dasharray="140 420" stroke-linecap="round"/>
        <path class="spark" d="M38 40 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="var(--accent)"/>
        <path class="spark b" d="M162 60 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" fill="var(--accent)"/>
      </g>
      <g class="only-rejected"><rect x="150" y="60" width="44" height="40" rx="8" fill="var(--card)" stroke="var(--red)" stroke-width="4"/><line x1="160" y1="70" x2="184" y2="90" stroke="var(--red)" stroke-width="4" stroke-linecap="round"/><line x1="184" y1="70" x2="160" y2="90" stroke="var(--red)" stroke-width="4" stroke-linecap="round"/></g>
      <g class="body">
        <line x1="100" y1="46" x2="100" y2="18" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <circle id="tip" cx="100" cy="14" r="8" fill="var(--accent)"/>
        <rect x="40" y="46" width="120" height="104" rx="38" fill="var(--accent)"/>
        <rect x="54" y="66" width="92" height="56" rx="22" fill="var(--face)"/>
        <g class="brows"><path d="M74 86 L90 92" stroke="#17263A" stroke-width="4" stroke-linecap="round"/><path d="M126 86 L110 92" stroke="#17263A" stroke-width="4" stroke-linecap="round"/></g>
        <g class="eye"><circle cx="82" cy="94" r="7" fill="#17263A"/></g>
        <g class="eye"><circle cx="118" cy="94" r="7" fill="#17263A"/></g>
        <path class="mouth-idle" d="M86 108 Q100 118 114 108" stroke="#17263A" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path class="mouth-happy" d="M84 106 Q100 122 116 106" stroke="#17263A" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path class="mouth-sad" d="M88 114 Q100 106 112 114" stroke="#17263A" stroke-width="4" fill="none" stroke-linecap="round"/>
        <rect x="26" y="88" width="18" height="40" rx="9" fill="var(--accent)"/>
        <rect x="156" y="88" width="18" height="40" rx="9" fill="var(--accent)"/>
        <rect x="66" y="148" width="24" height="26" rx="10" fill="var(--ink)"/>
        <rect x="110" y="148" width="24" height="26" rx="10" fill="var(--ink)"/>
      </g>
      <ellipse cx="100" cy="186" rx="52" ry="7" fill="var(--ink)" opacity="0.2"/>
    </svg>
    <div class="title" id="title">Up to date</div>
    <div class="note" id="note">Bolt checks for a new version every so often.</div>
    <div class="bar"><div id="bar"></div></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2>Update history</h2>
      <button type="button" class="link" id="clear">Clear</button>
    </div>
    <div class="list" id="history"><div class="empty">nothing yet</div></div>
  </div>

  <div class="settings" id="settings" hidden>
    <div class="setting"><span id="server-label">Update server</span><div class="seg" id="servers" role="group" aria-labelledby="server-label"></div></div>
    <div class="hint" id="server-url"></div>
    <div class="setting"><label for="interval">Check every</label><select id="interval"></select></div>
  </div>

  <footer><div>server <b id="server"></b></div><div>client <b id="client"></b></div></footer>
</div>
<script>
  // The page is a view of /api/state. The server side changes state in
  // milliseconds for a plain check, so the checking animation is held for
  // a couple of seconds whenever a new check is seen, so it is visible.
  var lastCheck = null, holdUntil = 0, STEP_COLOR = { started: 'var(--green)', confirmed: 'var(--green)', available: 'var(--blue)', downloaded: 'var(--blue)', installed: 'var(--blue)', rejected: 'var(--red)', rolledback: 'var(--red)' };
  function el(id) { return document.getElementById(id); }
  function text(id, v) { el(id).textContent = v; }
  function fmt(t) { var d = new Date(t); return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function render(s) {
    text('version', 'v' + s.version); text('channel', s.channel + ' channel');
    var cloud = (s.servers || []).filter(function (o) { return o.id === 'cloud' && o.url === s.server; }).length > 0;
    text('server', cloud ? 'Cloud' : s.server.replace(/^https?:\/\//, '')); text('client', (s.client_id || '').slice(0, 8) || 'none');
    var now = Date.now(), state = s.status;
    if (s.last_check && s.last_check !== lastCheck) { lastCheck = s.last_check; holdUntil = now + 2500; }
    if (state === 'idle' && now < holdUntil) state = 'checking';
    document.body.dataset.state = state;
    var next = s.next_check ? new Date(s.next_check).getTime() : 0, last = s.last_check ? new Date(s.last_check).getTime() : 0;
    var secs = Math.max(0, Math.round((next - now) / 1000));
    if (state === 'idle') { text('title', 'Up to date'); el('note').innerHTML = 'Bolt checks for a new version regularly.<br>Next check in <b>' + secs + 's</b>'; }
    if (state === 'checking') { text('title', 'Checking for updates'); text('note', s.status_note || 'asking the server'); }
    if (state === 'updating') { text('title', s.status_note || 'Installing update'); text('note', 'Signature verified, download checked, self-test running, then a restart.'); }
    if (state === 'rejected') { text('title', 'Something went wrong'); text('note', s.status_note || ''); }
    var pct = (next > last && state === 'idle') ? 100 * (now - last) / (next - last) : 100;
    el('bar').style.width = Math.min(100, Math.max(0, pct)) + '%';
    var h = s.history || [];
    el('history').innerHTML = h.length ? h.slice(0, 50).map(function (e) {
      return '<div class="row"><div class="dot" style="background:' + (STEP_COLOR[e.step] || 'var(--faint)') + '"></div><div style="flex-grow:1"><div class="t">' + esc(e.detail) + '</div><div class="d">while running v' + esc(e.version) + '</div></div><time>' + fmt(e.time) + '</time></div>';
    }).join('') : '<div class="empty">nothing yet</div>';
  }
  function label(sec) {
    if (sec % 3600 === 0) return (sec / 3600) + (sec === 3600 ? ' hour' : ' hours');
    if (sec % 60 === 0) return (sec / 60) + (sec === 60 ? ' minute' : ' minutes');
    return sec + ' seconds';
  }
  // Settings: rebuilt only when they change, so a click or an open menu is
  // never interrupted by the once-a-second refresh.
  var shown = '';
  function renderSettings(s) {
    if (!s.settings) return;
    el('settings').hidden = false;
    var key = JSON.stringify([s.settings, s.servers, s.intervals]);
    if (key === shown || document.activeElement === el('interval')) return;
    shown = key;
    el('servers').innerHTML = '';
    s.servers.forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = o.label;
      b.setAttribute('aria-pressed', o.id === s.settings.server ? 'true' : 'false');
      // Clicking the server already in use does nothing; that also covers
      // Custom, which exists only for this run and cannot be saved.
      b.onclick = function () { if (o.id !== s.settings.server) save({ server: o.id }); };
      el('servers').appendChild(b);
      // The cloud address is not shown; a local or custom one is.
      if (o.id === s.settings.server) { text('server-url', o.id === 'cloud' ? '' : o.url); el('server-url').hidden = o.id === 'cloud'; }
    });
    var choices = s.intervals.slice();
    if (choices.indexOf(s.settings.interval_seconds) < 0) choices.unshift(s.settings.interval_seconds);
    el('interval').innerHTML = '';
    choices.forEach(function (sec) {
      var opt = document.createElement('option');
      opt.value = sec; opt.textContent = label(sec); opt.selected = sec === s.settings.interval_seconds;
      el('interval').appendChild(opt);
    });
    el('interval').onchange = function () { save({ interval_seconds: Number(el('interval').value) }); el('interval').blur(); };
  }
  // Sends only the field that changed, so a value given on the command
  // line for this run is never saved by accident.
  function save(v) {
    fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(v) })
      .then(function (r) {
        shown = ''; poll();
        if (!r.ok) { el('server-url').hidden = false; text('server-url', 'Could not save that setting.'); }
      });
  }
  el('clear').onclick = function () {
    fetch('/api/history/clear', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).then(poll);
  };
  function poll() { fetch('/api/state').then(function (r) { return r.json(); }).then(function (s) { render(s); renderSettings(s); }).catch(function () {}); }
  poll(); setInterval(poll, 1000);
</script>
</body>
</html>
