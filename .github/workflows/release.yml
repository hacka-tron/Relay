# Tag a commit v1.2.0 and push the tag: this builds, signs and publishes
# the release.
#
# The desktop window links against each OS's native web engine, so each
# platform compiles on a matching runner. Those jobs only need the public
# key (pubkey.txt). One final job downloads every binary, signs them with
# the UPDATER_SIGNING_KEY secret and publishes, so the private key is
# exposed to exactly one job.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  compile:
    strategy:
      matrix:
        include:
          - { runner: macos-latest, targets: "darwin/arm64,darwin/amd64", desktop: true }
          - { runner: ubuntu-24.04, targets: "linux/amd64", desktop: true }
          - { runner: ubuntu-24.04, targets: "windows/amd64", desktop: true }
          # No arm64 Linux runner here, so that build keeps the browser window.
          - { runner: ubuntu-24.04, targets: "linux/arm64", desktop: false }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: native libraries
        if: matrix.desktop && startsWith(matrix.targets, 'linux')
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: compile
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go run ./cmd/release compile --version "$VERSION" --targets "${{ matrix.targets }}" ${{ matrix.desktop && '--desktop' || '' }}
      - name: macOS app bundles
        if: startsWith(matrix.targets, 'darwin')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for arch in arm64 amd64; do
            OUT="$RUNNER_TEMP/bundle-$arch"; mkdir -p "$OUT"
            scripts/macos-app.sh "releases/$VERSION/app-darwin-$arch" "$VERSION" "$OUT"
            mv "$OUT"/Relay-macos-*.zip "releases/$VERSION/"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-${{ strategy.job-index }}
          path: releases/
          if-no-files-found: error

  publish:
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: actions/download-artifact@v4
        with:
          pattern: compiled-*
          path: releases/
          merge-multiple: true
      - name: sign
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
        run: go run ./cmd/release sign --version "${GITHUB_REF_NAME#v}"
      - name: publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ls -la "releases/$VERSION"
          gh release create "$GITHUB_REF_NAME" releases/"$VERSION"/* --repo "$GITHUB_REPOSITORY" --title "v$VERSION" --generate-notes
