name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # A real update on this OS: start Relay 1.0.0, publish 1.1.0 and watch
      # it install and restart, then publish a tampered 1.2.0 and watch it
      # get refused.
      - name: update end to end
        run: go run ./cmd/demo ci
      - name: desktop build compiles
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
                   go build -tags desktop,production,webkit2_41 -o /dev/null ./cmd/app ;;
            macOS) CGO_LDFLAGS="-framework UniformTypeIdentifiers" go build -tags desktop,production -o /dev/null ./cmd/app ;;
            Windows) go build -tags desktop,production -ldflags "-H windowsgui" -o app.exe ./cmd/app ;;
          esac
      - if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
